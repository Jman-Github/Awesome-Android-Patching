name: Sync patch sources from registry

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview README changes without committing
        type: boolean
        default: false

concurrency:
  group: readme-updates-${{ github.ref }}
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync patch sources and check repository links
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/sync_patch_sources.py --dry-run
          else
            python scripts/sync_patch_sources.py
          fi
      - name: Commit and push README if changed
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync patch sources from registry"
            git push
          fi
